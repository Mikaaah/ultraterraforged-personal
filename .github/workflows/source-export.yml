name: Export repository source
on:
  workflow_dispatch:
  push:
    branches: [fix/tnk3-biome-exclusions]
    paths: ['.github/workflows/source-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive versioned source
        run: git archive --format=zip HEAD -o repository-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.zip
          retention-days: 7
