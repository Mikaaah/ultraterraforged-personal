modLoader="javafml"
loaderVersion="[1,)"
license="GPL-3.0-only"
issueTrackerURL="https://github.com/Mikaaah/ultraterraforged-personal/issues"

[[mods]]
modId="ultraterraforged"
displayName="TNKTerraForged"
version="${version}"
authors="Mikaaah (TNKTerraForged); pandaismyname1 (UltraTerraForged original)"
credits="A continuation of ReTerraForged by raccoonman, Steveplays28 and EdoEquin0x, itself a continuation of TerraForged by dags and Won-Ton"
logoFile="logo.png"
displayURL="https://github.com/Mikaaah/ultraterraforged-personal"
description='''TNK3-focused overworld terrain generation built from UltraTerraForged, ReTerraForged and TerraForged. Massive caves and modded structure safeguards.'''

[[mixins]]
config="tnkterraforged-common.mixins.json"

[[mixins]]
config="tnkterraforged-neoforge.mixins.json"

[[mixins]]
config="tnkterraforged-alex-caves.mixins.json"

[[mixins]]
config="tnkterraforged-streams.mixins.json"

[[dependencies.ultraterraforged]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ultraterraforged]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},1.21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ultraterraforged]]
    modId="terrablender"
    type="optional"
    versionRange="[4.1.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ultraterraforged]]
    modId="alexscaves"
    type="optional"
    versionRange="[2.0.10,2.0.11)"
    ordering="AFTER"
    side="BOTH"

# Integrated native-current adapter; Streams itself stays a separate optional mod.
[[dependencies.ultraterraforged]]
    modId="streamsreflowing"
    type="optional"
    versionRange="[2.15.2,2.15.3)"
    ordering="AFTER"
    side="BOTH"

# Do not load the old standalone compatibility addon alongside this integration.
[[dependencies.ultraterraforged]]
    modId="utfstreams"
    type="incompatible"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
